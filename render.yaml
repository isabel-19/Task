# Free app with persistent data and private files in a separate Supabase project.
services:
  - type: web
    name: roadmap-ogc
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: false
      - key: COOKIE_SECURE
        value: true
      - key: FRONTEND_ORIGINS
        sync: false
      - key: SESSION_HOURS
        value: 8
      - key: IMPORTS_ENABLED
        value: false
      - key: CLOUD_PUBLIC_API_URL
        sync: false
      - key: CLOUD_FRONTEND_URL
        sync: false
      - key: CLOUD_TOKEN_KEY
        sync: false
      - key: EVIDENCE_STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: roadmap-evidence
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: EVIDENCE_UPLOADS_ENABLED
        value: true
      - key: EVIDENCE_MAX_UPLOAD_MB
        value: 20
      - key: RUN_MIGRATIONS
        value: true
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: BOOTSTRAP_EMAIL
        sync: false
      - key: BOOTSTRAP_NAME
        value: Jefatura OGC
      - key: BOOTSTRAP_PASSWORD
        sync: false
